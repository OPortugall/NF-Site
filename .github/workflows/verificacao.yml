# Verificação automática do repositório NF-Site (Fase 1 do CI).
# Roda a cada push, a cada pull request para a main e também manualmente (aba Actions → Run workflow).

name: Verificação

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call: # usada também pela Publicação (publicar.yml): só publica se passar

permissions:
  contents: read

concurrency:
  group: verificacao-${{ github.workflow }}-${{ github.ref }} # quando chamada pela Publicação, grupo próprio (não cancela a outra)
  cancel-in-progress: true

jobs:
  segredos:
    name: Senhas e chaves (gitleaks)
    runs-on: ubuntu-24.04 # versão fixa: ubuntu-latest muda de versão sozinho (troca para o 26 em out/2026)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico completo: procura segredos em todos os commits, não só no último
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1 # mesma versão testada localmente com o .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false

  verificacao:
    name: Arquivos, código malicioso e conteúdo
    runs-on: ubuntu-24.04 # versão fixa: ubuntu-latest muda de versão sozinho (troca para o 26 em out/2026)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Rodar scripts/verificar.py
        run: python scripts/verificar.py
